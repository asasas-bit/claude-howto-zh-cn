name: Build and Release EPUB

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install mmdc (Mermaid CLI)
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Build EPUB
        run: |
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/puppeteer-ci.json
          uv run scripts/build_epub.py \
            --lang zh \
            --puppeteer-config /tmp/puppeteer-ci.json

      - name: Verify EPUB Created
        run: test -s claude-howto-guide.epub

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: claude-howto-guide.epub
          generate_release_notes: true
